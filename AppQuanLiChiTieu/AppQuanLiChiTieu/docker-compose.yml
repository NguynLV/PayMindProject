services:
  app:
    build: ./AppQuanLiChiTieu
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver;databaseName=Project_Exe1;encrypt=true;trustServerCertificate=true
      - DB_USERNAME=sa
      - DB_PASSWORD=yourStrong(!)Password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=AIzaSyDuFXcPePZpu09k-uwJJ9VnpweoEjmlt5g
    depends_on:
      - sqlserver
      - redis

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=yourStrong(!)Password
      - MSSQL_PID=Developer

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./PayMind-Web:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
